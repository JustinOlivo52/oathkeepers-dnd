services:
  - type: web
    name: oathkeepers
    runtime: docker
    plan: starter
    branch: master
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oathkeepers-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROUP_CODE
        sync: false
      - key: DM_MONTHLY_BUDGET_USD
        value: "20"

databases:
  - name: oathkeepers-db
    plan: basic-256mb
    databaseName: oathkeepers
    user: oathkeepers
